<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Interval Timer</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f1ea;
        --ink: #20201e;
        --muted: #77736b;
        --accent: #df5b3f;
        --track: #ddd8ce;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 42px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .dial {
        position: relative;
        width: min(72vw, 286px);
        aspect-ratio: 1;
        margin: 0 auto 42px;
        display: grid;
        place-items: center;
      }

      .dial svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .track,
      .progress {
        fill: none;
        stroke-width: 5;
      }

      .track {
        stroke: var(--track);
      }
      .progress {
        stroke: var(--accent);
        stroke-linecap: round;
        transition: stroke-dashoffset 0.12s linear;
      }

      .time {
        font-size: clamp(54px, 15vw, 72px);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .label {
        margin-top: 12px;
        color: var(--muted);
        font-size: 14px;
      }

      button {
        border: 0;
        cursor: pointer;
        font: inherit;
        transition:
          transform 0.15s ease,
          background 0.15s ease,
          color 0.15s ease;
      }

      button:active {
        transform: scale(0.975);
      }
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
        outline-offset: 3px;
      }

      #toggle {
        width: 100%;
        min-height: 58px;
        border-radius: 999px;
        background: var(--ink);
        color: white;
        font-size: 16px;
        font-weight: 700;
      }

      #toggle:hover {
        background: #363633;
      }

      .hint {
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      code {
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Interval timer</p>

      <section class="dial" aria-label="Time until next beep">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="55" />
          <circle class="progress" cx="60" cy="60" r="55" />
        </svg>
        <div>
          <div class="time" id="time">0:30</div>
          <div class="label" id="label">until next beep</div>
        </div>
      </section>

      <button id="toggle" type="button">Start timer</button>
      <p class="hint">Repeats every <span id="intervalText">30 seconds</span> · Set with <code>?interval=45</code></p>
    </main>

    <script>
      (() => {
        const DEFAULT_SECONDS = 30;
        const params = new URLSearchParams(location.search);
        const requested = Number(params.get("interval"));
        const seconds = Number.isFinite(requested) && requested >= 1 && requested <= 86400 ? Math.round(requested) : DEFAULT_SECONDS;
        const intervalMs = seconds * 1000;

        const timeEl = document.querySelector("#time");
        const labelEl = document.querySelector("#label");
        const toggleEl = document.querySelector("#toggle");
        const intervalTextEl = document.querySelector("#intervalText");
        const progressEl = document.querySelector(".progress");
        const circumference = 2 * Math.PI * 55;

        let running = false;
        let nextBeepAt = 0;
        let timeoutId = null;
        let frameId = null;
        let audioContext = null;

        progressEl.style.strokeDasharray = circumference;
        intervalTextEl.textContent = `${seconds} ${seconds === 1 ? "second" : "seconds"}`;

        function formatTime(milliseconds) {
          const total = Math.max(0, Math.ceil(milliseconds / 1000));
          const minutes = Math.floor(total / 60);
          return `${minutes}:${String(total % 60).padStart(2, "0")}`;
        }

        function render(remaining = intervalMs) {
          timeEl.textContent = formatTime(remaining);
          const fraction = Math.min(1, Math.max(0, remaining / intervalMs));
          progressEl.style.strokeDashoffset = circumference * (1 - fraction);
        }

        async function ensureAudio() {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          await audioContext.resume();
        }

        function tone({ frequency, endFrequency, start = 0, duration = 0.2, volume = 0.2, type = "sine" }) {
          const at = audioContext.currentTime + start;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = type;
          oscillator.frequency.setValueAtTime(frequency, at);
          if (endFrequency) oscillator.frequency.exponentialRampToValueAtTime(endFrequency, at + duration);
          gain.gain.setValueAtTime(0.0001, at);
          gain.gain.exponentialRampToValueAtTime(volume, at + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start(at);
          oscillator.stop(at + duration + 0.02);
        }

        function beep() {
          tone({ frequency: 740, duration: 0.8, volume: 0.16 });
          tone({ frequency: 1480, duration: 0.65, volume: 0.07 });
          tone({ frequency: 2220, duration: 0.45, volume: 0.035 });
        }

        function scheduleBeep() {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(
            () => {
              if (!running) return;
              beep();
              const now = performance.now();
              do nextBeepAt += intervalMs;
              while (nextBeepAt <= now);
              scheduleBeep();
            },
            Math.max(0, nextBeepAt - performance.now())
          );
        }

        function update() {
          if (!running) return;
          render(nextBeepAt - performance.now());
          frameId = requestAnimationFrame(update);
        }

        async function start() {
          await ensureAudio();
          running = true;
          nextBeepAt = performance.now() + intervalMs;
          toggleEl.textContent = "Stop timer";
          labelEl.textContent = "until next beep";
          beep();
          scheduleBeep();
          update();
        }

        function stop() {
          running = false;
          clearTimeout(timeoutId);
          cancelAnimationFrame(frameId);
          toggleEl.textContent = "Start timer";
          labelEl.textContent = "ready when you are";
          render();
        }

        toggleEl.addEventListener("click", () => (running ? stop() : start()));
        render();
      })();
    </script>
  </body>
</html>
